<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f8">
  <title>Animal Explore</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css?v=20261118-rubika2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="chat.js?v=20261118-rubika2"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="logo">🐾</div>
      <div><b>Animal Explore</b><small>دنیای مجازی انیمال راش</small></div>
    </div>
    <button id="authBtn" class="ghost">ورود / ثبت‌نام</button>
  </header>
  <div class="ad-strip" id="adStrip">
    <span class="ad-tag">تبلیغ</span>
    <b>جایگاه تبلیغات Animal Explore</b>
    <small>به‌زودی</small>
  </div>
  <div id="authPanel" class="panel auth hidden">
    <h2>ورود به Animal Explore</h2>
    <div class="tabs">
      <button type="button" id="showLogin" class="active">ورود</button>
      <button type="button" id="showSignup">ثبت‌نام</button>
    </div>
    <div id="loginFields">
      <input id="loginUsername" placeholder="آیدی پیام">
      <input id="loginPassword" type="password" placeholder="رمز عبور">
      <button id="login" class="primary full">ورود</button>
    </div>
    <div id="signupFields" class="hidden">
      <input id="displayName" placeholder="نام نمایشی">
      <input id="signupUsername" placeholder="آیدی پیام (مثلاً parham)">
      <input id="signupAge" type="number" placeholder="سن">
      <input id="signupGameId" placeholder="شناسه انیمال راش">
      <textarea id="signupBio" placeholder="بیوگرافی"></textarea>
      <input id="signupPassword" type="password" placeholder="رمز عبور">
      <label class="hint">عکس پروفایل</label>
      <input id="signupAvatar" type="file" accept="image/*">
      <button id="signup" class="primary full">ساخت حساب</button>
    </div>
  </div>
  <main id="view" class="view">
    <div class="welcome">
      <h1>به Animal Explore خوش آمدی 🐾</h1>
      <p>دنیای مجازی انیمال راش</p>
      <p class="muted">برای شروع وارد حساب شو یا ثبت‌نام کن.</p>
    </div>
  </main>
  <nav class="nav">
    <button data-page="explore" class="active"><i>▦</i><span>ویترین</span></button>
    <button data-page="following"><i>♡</i><span>ویترین شخصی</span></button>
    <button data-page="chat"><i>▤</i><span>پیام‌رسان</span></button>
    <button data-page="wallet"><i>◈</i><span>کیف پول</span></button>
    <button data-page="profile"><i>⌂</i><span>پروفایل من</span></button>
  </nav>
</div>
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="closeModal">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
